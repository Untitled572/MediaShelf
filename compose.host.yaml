# Linux only: use the host loopback proxy; keep the WebUI loopback-only.
services:
  mediashelf:
    build: .
    image: mediashelf:local
    restart: unless-stopped
    network_mode: host
    environment:
      MEDIASHELF_ADDR: 127.0.0.1:${MEDIASHELF_PORT:-18765}
      MEDIASHELF_PASSWORD: ${MEDIASHELF_PASSWORD:?Set a password of at least 12 characters}
    volumes:
      - mediashelf-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  mediashelf-data:
